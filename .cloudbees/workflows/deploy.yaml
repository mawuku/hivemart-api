# Component deploy workflow, called by the application's deployer workflow.
#
# Release Orchestration requires every component's deploy.yaml to accept:
#   artifact-id (string)  - the registered artifact to deploy
#   environment (string)  - the target environment name
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    steps:
      # Simulated deployment - replace with real logic, e.g. the Helm or
      # Kubernetes deploy actions from the CloudBees action catalog:
      # https://docs.cloudbees.com/docs/cloudbees-unify/latest/release-orchestration/how-to-guides/deploy-to-kubernetes
      - name: Deploy hivemart-api (simulated)
        uses: docker://alpine:3.20
        run: |
          echo "=== hivemart-api deployment ==="
          echo "Artifact ID : ${{ inputs.artifact-id }}"
          echo "Environment : ${{ inputs.environment }}"
          echo "Simulating rollout..."
          sleep 5
          echo "hivemart-api deployed to ${{ inputs.environment }}."
